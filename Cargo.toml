[workspace]
resolver = "2"
members = [
    "crates/spellman-language",
    "crates/spellman-detector",
    "crates/spellman-cli",
]
# svod is an optional local checkout kept for svod development; the
# dependency itself comes from git (npatsakula/svod, branch main), so a
# plain clone builds without it.
# benchmarks is standalone on purpose: lingua's model crates are a heavy
# build that must not slow down everyday workspace commands.
exclude = ["svod", "benchmarks"]
