[project]
name = "spellman-train"
version = "0.1.0"
description = "Training / evaluation pipeline for spellman: FineWeb-2 sampling, hash A/B, fastText-style embedding model, folded export"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "torch>=2.4",
    "safetensors>=0.4",
    "datasets>=3.0",
    "huggingface-hub>=0.25",
    "tqdm>=4.66",
    "polars>=1.43.2",
    "fasttext-numpy2>=0.10.4",
    "ml-dtypes>=0.2",
    "pymorphy3>=2.0.6",
    "pymorphy2-dicts-uk>=2.4.1.1.1460299261",
    "stanza>=1.14.0",
]

[project.scripts]
spellman-gen-fixtures = "gen_fixtures:main"
spellman-mix = "mix:main"
spellman-train = "train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
