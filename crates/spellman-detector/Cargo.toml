[package]
name = "spellman-detector"
version = "0.1.0"
edition = "2024"
description = "Cyrillic-optimized language detection: hashed char n-grams, folded fastText-style model, svod JIT bulk inference"
license = "MIT"

[dependencies]
spellman-language = { path = "../spellman-language" }
svod-tensor = { path = "../../svod/tensor" }
svod-model = { path = "../../svod/model" }
svod-macros = { path = "../../svod/macros" }
svod-ir = { path = "../../svod/ir" }
svod-dtype = { path = "../../svod/dtype" }
svod-device = { path = "../../svod/device" }
svod-runtime = { path = "../../svod/runtime" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
bytemuck = "1"
rayon = "1"
hf-hub = "0.5.0"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
safetensors = "0.6"

[[bench]]
name = "bench"
harness = false
