[package]
name = "spellman-detector"
version = "0.1.0"
edition = "2024"
description = "Cyrillic-optimized language detection: hashed char n-grams, folded fastText-style model, svod JIT bulk inference"
license = "MIT"

[dependencies]
spellman-language = { path = "../spellman-language" }
svod-tensor = { git = "https://github.com/npatsakula/svod", branch = "main" }
svod-model = { git = "https://github.com/npatsakula/svod", branch = "main" }
svod-macros = { git = "https://github.com/npatsakula/svod", branch = "main" }
svod-ir = { git = "https://github.com/npatsakula/svod", branch = "main" }
svod-dtype = { git = "https://github.com/npatsakula/svod", branch = "main" }
svod-device = { git = "https://github.com/npatsakula/svod", branch = "main" }
svod-runtime = { git = "https://github.com/npatsakula/svod", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.9"
bytemuck = "1"
rayon = "1"
hf-hub = "0.5.0"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
safetensors = "0.6"
clap = { version = "4", features = ["derive"] }
svod-schedule = { git = "https://github.com/npatsakula/svod", branch = "main" }

[[bench]]
name = "bench"
harness = false
