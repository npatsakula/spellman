[package]
name = "spellman-detector"
version = "0.1.0-alpha.4"
edition = "2024"
description = "Cyrillic-optimized language detection: hashed char n-grams, folded fastText-style model, svod JIT bulk inference"
license = "MIT"
repository = "https://github.com/npatsakula/spellman"
readme = "README.md"
keywords = ["language-detection", "nlp", "lid", "cyrillic", "spellman"]
categories = ["text-processing", "localization"]
# fixtures/hash_vectors.json is required by tests/hash_vectors.rs.
include = ["src/**", "tests/**", "benches/**", "examples/**", "fixtures/**", "README.md"]

[dependencies]
spellman-language = { path = "../spellman-language", version = "0.1.0-alpha.4" }
svod-tensor = "0.1.0-alpha.5"
svod-model = "0.1.0-alpha.5"
svod-macros = "0.1.0-alpha.5"
svod-ir = "0.1.0-alpha.5"
svod-dtype = "0.1.0-alpha.5"
svod-device = "0.1.0-alpha.5"
svod-runtime = "0.1.0-alpha.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snafu = "0.9"
bytemuck = "1"
rayon = "1"
hf-hub = "0.5.0"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"
safetensors = "0.6"
clap = { version = "4", features = ["derive"] }
svod-schedule = "0.1.0-alpha.5"

[[bench]]
name = "bench"
harness = false
