name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flake-check:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # FlakeHub Cache auth
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/determinate-nix-action@v3.22.2

      - uses: DeterminateSystems/flakehub-cache-action@main

      - name: nix flake check
        run: nix flake check -L

      # Sanity: the CLI binary builds through nix and runs (the JIT plan
      # itself is exercised by the `test` check's end-to-end smoke test).
      - name: spellman --help smoke test
        run: nix run . -- --help
