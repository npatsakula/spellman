name: Publish

# Tag-driven publishing, same shape as svod's: pushing a tag `vX.Y.Z` is
# the publish button. The workflow verifies the workspace, publishes the
# three crates to crates.io in dependency order (language -> detector ->
# cli, waiting for each to be resolvable before the next), then creates
# the GitHub Release automatically (draft, prerelease auto-detected from
# the version, generated notes + crates.io links, .crate files attached).
# Idempotent: versions already on crates.io are detected and skipped, so
# re-running is safe.
#
# Required secret (Settings -> Secrets and variables -> Actions):
# CARGO_REGISTRY_TOKEN - a crates.io API token with publish-new scope.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release + upload .crate assets

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Ordered publish list, dependencies first.
  PUBLISH_CRATES: spellman-language spellman-detector spellman-cli

jobs:
  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Verify the workspace
        run: |
          cargo build --release --workspace
          cargo test --release --workspace

      - name: Publish to crates.io in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          publish_crate() {
            local crate="$1"
            local version
            version=$(cargo pkgid -p "$crate" | sed 's/.*[#@]//')

            # Produce the .crate file up front so the release asset exists
            # even when the upload below is skipped as already published.
            cargo package -p "$crate"

            # Idempotency: a version already on crates.io is skipped.
            if curl -sf -A "spellman-publish-workflow" \
              "https://crates.io/api/v1/crates/$crate/$version" -o /dev/null; then
              echo "::notice::$crate $version is already on crates.io — skipping upload"
              return 0
            fi

            echo "::group::cargo publish -p $crate"
            local output
            if output=$(cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN" 2>&1); then
              echo "$output"
              echo "::notice::published $crate $version"
            else
              local status=$?
              echo "$output"
              if echo "$output" | grep -qiE 'already (exists|uploaded|published)'; then
                echo "::notice::$crate $version was already published — skipping"
              else
                echo "::error::cargo publish failed for $crate"
                return "$status"
              fi
            fi
            echo "::endgroup::"
          }

          wait_for_crate() {
            local crate="$1" version="$2" elapsed=0
            echo "Waiting for $crate@$version to be resolvable..."
            while [ $elapsed -lt 300 ]; do
              if curl -sf -A "spellman-publish-workflow" \
                "https://crates.io/api/v1/crates/$crate/$version" -o /dev/null; then
                echo "$crate@$version is available"
                return 0
              fi
              sleep 15
              elapsed=$((elapsed + 15))
            done
            echo "::error::timed out waiting for $crate@$version"
            return 1
          }

          for crate in $PUBLISH_CRATES; do
            version=$(cargo pkgid -p "$crate" | sed 's/.*[#@]//')
            publish_crate "$crate"
            wait_for_crate "$crate" "$version"
          done

      - name: Upload .crate packages
        uses: actions/upload-artifact@v4
        with:
          name: crates
          path: target/package/*.crate

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: crates
          path: target/package

      - name: Detect pre-release and build crates.io links
        id: meta
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if echo "$VERSION" | grep -qE '(alpha|beta|rc)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "links<<EOF"
            echo "## Crates"
            echo ""
            for crate in spellman-language spellman-detector spellman-cli; do
              echo "- [\`$crate\`](https://crates.io/crates/$crate/$VERSION)"
            done
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          append_body: true
          body: ${{ steps.meta.outputs.links }}
          files: target/package/*.crate
